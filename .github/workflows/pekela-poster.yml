name: VV Pekela weekly poster

on:
  schedule:
    # 07:00 UTC every Thursday - ~09:00 Europe/Amsterdam in summer (CEST),
    # ~08:00 in winter (CET). Single cron line accepted for simplicity; the
    # ~1h seasonal drift doesn't matter for a weekly amateur-football poster.
    - cron: "0 7 * * 4"
  workflow_dispatch: {}

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/pekela
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/pekela/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate posters and send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
        run: python main.py

      - name: Upload posters as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pekela-posters
          path: |
            automation/pekela/poster_senioren.png
            automation/pekela/poster_jeugd.png
          if-no-files-found: ignore
          retention-days: 30
